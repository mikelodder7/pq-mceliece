[package]
authors = ["Michael Lodder <redmike7@gmail.com>"]
categories = ["cryptography"]
description = "A pure Rust implementation of the Classic McEliece post-quantum KEM"
documentation = "https://docs.rs/pq-mceliece"
edition = "2024"
exclude = ["tests/**", "benches/**", "examples/**", ".github/**", "ISA.md"]
homepage = "https://github.com/mikelodder7/pq-mceliece"
keywords = ["post-quantum", "kem", "mceliece", "cryptography", "encryption"]
license = "Apache-2.0 OR MIT"
name = "pq-mceliece"
readme = "README.md"
repository = "https://github.com/mikelodder7/pq-mceliece"
rust-version = "1.88"
version = "0.2.0"

[features]
default = ["nist", "iso", "serde", "keygen", "encapsulate", "decapsulate", "kem"]

# The three KEM operations, selectable independently so that a build only carries the code
# and dependencies it uses. At least one must be enabled.
#
# Encapsulation is by far the lightest: it needs no field arithmetic beyond a mask, and none
# of the matrix, sorting, Beneš network or control-bit machinery.
keygen = ["dep:rand_core"]
encapsulate = ["dep:rand_core"]
decapsulate = []

# Implementations of the `kem` crate traits, which cover all three operations at once.
kem = ["dep:kem", "dep:hybrid-array", "keygen", "encapsulate", "decapsulate"]

# The ten parameter sets in the NIST round-4 submission.
nist = [
    "mceliece348864",
    "mceliece348864f",
    "mceliece460896",
    "mceliece460896f",
    "mceliece6688128",
    "mceliece6688128f",
    "mceliece6960119",
    "mceliece6960119f",
    "mceliece8192128",
    "mceliece8192128f",
]

# The sixteen parameter sets standardized by ISO in June 2026.
iso = [
    "mceliece460896",
    "mceliece460896f",
    "mceliece460896pc",
    "mceliece460896pcf",
    "mceliece6688128",
    "mceliece6688128f",
    "mceliece6688128pc",
    "mceliece6688128pcf",
    "mceliece6960119",
    "mceliece6960119f",
    "mceliece6960119pc",
    "mceliece6960119pcf",
    "mceliece8192128",
    "mceliece8192128f",
    "mceliece8192128pc",
    "mceliece8192128pcf",
]

# The plaintext-confirmation parameter sets. ISO only; not part of the NIST submission.
pc = [
    "mceliece460896pc",
    "mceliece460896pcf",
    "mceliece6688128pc",
    "mceliece6688128pcf",
    "mceliece6960119pc",
    "mceliece6960119pcf",
    "mceliece8192128pc",
    "mceliece8192128pcf",
]

mceliece348864 = []
mceliece348864f = []
mceliece460896 = []
mceliece460896f = []
mceliece460896pc = []
mceliece460896pcf = []
mceliece6688128 = []
mceliece6688128f = []
mceliece6688128pc = []
mceliece6688128pcf = []
mceliece6960119 = []
mceliece6960119f = []
mceliece6960119pc = []
mceliece6960119pcf = []
mceliece8192128 = []
mceliece8192128f = []
mceliece8192128pc = []
mceliece8192128pcf = []

hazmat = []
serde = ["dep:hex", "dep:serde"]

[dependencies]
ctutils = "0.4"
hex = { version = "0.4", optional = true }
hybrid-array = { version = "0.4.13", features = ["extra-sizes"], optional = true }
kem = { version = "0.3", optional = true }
rand_core = { version = "0.10", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
shake = "0.1"
thiserror = "2.0"

[target.'cfg(target_arch = "aarch64")'.dependencies]
zeroize = { version = "1", features = ["aarch64"] }

[target.'cfg(any(target_arch = "x86_64", target_arch = "x86"))'.dependencies]
zeroize = { version = "1", features = ["simd"] }

[target.'cfg(not(any(target_arch = "x86_64", target_arch = "x86", target_arch = "aarch64")))'.dependencies]
zeroize = "1"

# `rand` is used only by the doctests in README.md and the crate documentation, which
# `cargo-udeps` cannot see, so it reports a false positive without this.
[package.metadata.cargo-udeps.ignore]
development = ["rand"]

[dev-dependencies]
aes = "0.9"
criterion = "0.8"
hex = "0.4"
hybrid-array = "0.4"
postcard = { version = "1.0", features = ["use-std"] }
rand = { version = "0.10", features = ["sys_rng"] }
rand_chacha = "0.10"
serde_bare = "0.5"
serde_cbor = "0.11"
serde_json = "1.0"
serde_yaml = "0.9"
toml = "1.1.0"

[package.metadata.docs.rs]
features = ["nist", "iso", "hazmat", "serde", "keygen", "encapsulate", "decapsulate", "kem"]
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "round_trip"
path = "examples/round_trip.rs"
required-features = ["keygen", "encapsulate", "decapsulate"]

[[example]]
name = "recommended"
path = "examples/recommended.rs"
required-features = ["keygen", "encapsulate", "decapsulate", "mceliece6960119f"]

[[example]]
name = "kem_traits"
path = "examples/kem_traits.rs"
required-features = ["kem", "mceliece460896f", "mceliece6960119f"]

[[bench]]
name = "mceliece"
harness = false
path = "benches/mceliece.rs"
required-features = ["keygen", "encapsulate", "decapsulate"]
