name: pq-mceliece

on:
  pull_request:
    paths-ignore:
      - README.md
      - CONFORMANCE.md
      - SECURITY.md
      - LICENSE-APACHE
      - LICENSE-MIT
      - rustfmt.toml
  push:
    branches: main
    paths-ignore:
      - README.md
      - CONFORMANCE.md
      - SECURITY.md
      - LICENSE-APACHE
      - LICENSE-MIT
      - rustfmt.toml

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_LOG_STYLE: always
  RUSTFLAGS: "-Dwarnings"
  RUSTDOCFLAGS: "-Dwarnings"

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      # Parameter set groups carry no operations, so each needs one selecting explicitly.
      - run: cargo build --no-default-features --features=nist,keygen,encapsulate,decapsulate
      - run: cargo build --no-default-features --features=iso,keygen,encapsulate,decapsulate
      - run: cargo build --no-default-features --features=pc,keygen,encapsulate,decapsulate
      - run: cargo build --no-default-features --features=mceliece348864,keygen,encapsulate,decapsulate
      # Selecting no parameter set, and selecting no operation, must each be a clear error.
      - run: cargo build --no-default-features || [ $? -eq 101 ]
      - run: cargo build --no-default-features --features=nist || [ $? -eq 101 ]
      - run: cargo build --all-features

  # Every operation must build on its own, and drag in nothing the others need.
  operations:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ops:
          - keygen
          - encapsulate
          - decapsulate
          - keygen,encapsulate
          - keygen,decapsulate
          - encapsulate,decapsulate
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: cargo build --no-default-features --features=nist,iso,${{ matrix.ops }}
      - run: cargo test --no-default-features --features=nist,iso,${{ matrix.ops }} --release
      # Selecting no operation at all must be a clear compile error.
      - run: cargo build --no-default-features --features=nist || [ $? -eq 101 ]

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: cargo build --all-features --benches --release --keep-going
      - run: cargo test --all-features --release
      - run: cargo test --no-default-features --features=nist,serde,keygen,encapsulate,decapsulate --release

  # The carry-less multiply paths are compiled out by default on x86-64, so build and test
  # them explicitly.
  test-clmul:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-Dwarnings -C target-feature=+pclmulqdq"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: cargo test --all-features --release

  # Every other job runs on x86-64, so nothing else compiles the AArch64 code: the NEON
  # comparator in the sorting network, the PMULL carry-less multiply, and the compile-time
  # guard tying the comparator's width to CHAIN_WIDTH. The two runners differ in whether the
  # `aes` feature is on by default, which selects PMULL on macOS and the portable multiply on
  # Linux, so both are worth building.
  test-aarch64:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: cargo test --all-features --release
      - run: cargo clippy --all --all-features --all-targets -- -D warnings

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --all-features --workspace --release --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info

  careful:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm cargo-careful
      - run: cargo careful test --no-default-features --features=mceliece348864,mceliece6960119f,keygen,encapsulate,decapsulate --release

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --all --all-features --all-targets -- -D warnings
      - run: cargo clippy --all --no-default-features --features=nist,serde,keygen,encapsulate,decapsulate -- -D warnings
      - run: cargo clippy --all --no-default-features --features=nist,encapsulate -- -D warnings
      - run: cargo clippy --all --no-default-features --features=nist,decapsulate -- -D warnings
      - run: cargo clippy --all --no-default-features --features=nist,keygen -- -D warnings

  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt -- --check

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: cargo doc --all-features --no-deps

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm cargo-udeps
      - run: cargo udeps --all-targets --all-features

  outdated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm cargo-outdated
      - run: cargo outdated --root-deps-only --exit-code 1

  pants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm cargo-pants
      - run: cargo pants --loud --dev
